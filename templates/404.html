{% extends "base.html" %}
{% block robots %}
    <meta name="robots" content="noindex" />
{%- endblock robots %}
{% block seo %}{% endblock seo %}
{% block body %}
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:px-4 focus:py-2 focus:bg-boo-blue focus:text-white focus:rounded-lg"
  >Skip to main content</a
>
<div class="min-h-screen bg-boo-dark flex items-center justify-center">
  <div class="text-center px-6">
    <div class="relative mb-8">
      <h1
        class="text-[150px] md:text-[200px] font-bold text-transparent bg-clip-text bg-gradient-to-r from-boo-blue via-purple-500 to-boo-green animate-pulse"
      >
        404
      </h1>
      <div
        class="absolute inset-0 blur-3xl bg-gradient-to-r from-boo-blue/30 via-purple-500/30 to-boo-green/30 -z-10"
      ></div>
    </div>
    <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">Page Not Found</h2>
    <p class="text-white/60 mb-8 max-w-md mx-auto">
      Oops! The page you&#x27;re looking for doesn&#x27;t exist or has been moved.
    </p>
    <a
      class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl bg-gradient-to-r from-boo-blue via-purple-600 to-boo-green text-white font-bold text-lg shadow-[0_0_30px_rgba(0,163,255,0.5)] hover:shadow-[0_0_50px_rgba(0,163,255,0.7)] transition-all duration-300 hover:scale-105"
      href="/"
      ><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        ></path></svg
      >Back to Home</a
    >
    <div class="absolute top-20 left-10 w-20 h-20 border border-boo-blue/20 rotate-45 animate-spin-slow"></div>
    <div class="absolute bottom-20 right-10 w-16 h-16 border border-boo-green/20 rounded-full animate-pulse"></div>
  </div>
</div>
{% endblock body %}
